<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="সরকারি ব্রজমোহন কলেজ">
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#003f87" stroke-width="2.5"/>
  
  <!-- Inner background -->
  <circle cx="100" cy="100" r="90" fill="#ffffff"/>
  
  <!-- Red stars (top left and top right) -->
  <polygon points="35,30 38,38 47,38 41,43 43,52 35,47 27,52 29,43 23,38 32,38" fill="#e63946"/>
  <polygon points="165,30 168,38 177,38 171,43 173,52 165,47 157,52 159,43 153,38 162,38" fill="#e63946"/>
  
  <!-- Left wheat/laurel -->
  <g transform="translate(20, 85)">
    <path d="M 10 35 Q 5 30 8 20 M 10 35 Q 15 30 12 20" stroke="#228b22" stroke-width="1.5" fill="none"/>
    <circle cx="6" cy="18" r="1.2" fill="#228b22"/>
    <circle cx="10" cy="15" r="1.2" fill="#228b22"/>
    <circle cx="14" cy="18" r="1.2" fill="#228b22"/>
    <circle cx="5" cy="28" r="1.2" fill="#228b22"/>
    <circle cx="10" cy="26" r="1.2" fill="#228b22"/>
    <circle cx="15" cy="28" r="1.2" fill="#228b22"/>
  </g>
  
  <!-- Right wheat/laurel -->
  <g transform="translate(170, 85)">
    <path d="M 10 35 Q 5 30 8 20 M 10 35 Q 15 30 12 20" stroke="#228b22" stroke-width="1.5" fill="none"/>
    <circle cx="6" cy="18" r="1.2" fill="#228b22"/>
    <circle cx="10" cy="15" r="1.2" fill="#228b22"/>
    <circle cx="14" cy="18" r="1.2" fill="#228b22"/>
    <circle cx="5" cy="28" r="1.2" fill="#228b22"/>
    <circle cx="10" cy="26" r="1.2" fill="#228b22"/>
    <circle cx="15" cy="28" r="1.2" fill="#228b22"/>
  </g>
  
  <!-- Open book -->
  <g transform="translate(75, 50)">
    <path d="M 25 0 L 20 5 L 20 35 L 25 40 L 30 35 L 30 5 Z" stroke="#003f87" stroke-width="1.5" fill="none"/>
    <path d="M 25 0 L 30 5 L 30 35 L 25 40 L 20 35 L 20 5 Z" stroke="#003f87" stroke-width="1.5" fill="#e8f0ff" opacity="0.6"/>
    <line x1="22" y1="12" x2="28" y2="12" stroke="#666" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="18" x2="28" y2="18" stroke="#666" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="24" x2="28" y2="24" stroke="#666" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="30" x2="28" y2="30" stroke="#666" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Candle flame -->
  <polygon points="100,45 98,48 100,52 102,48" fill="#ff6b35" stroke="none"/>
  <polygon points="100,45 98,47 100,50 102,47" fill="#ffeb3b" stroke="none" opacity="0.8"/>
  
  <!-- Year text -->
  <text x="100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#003f87">স্থাপিত: ১৮৮৯</text>
  
  <!-- Bottom text arc -->
  <defs>
    <path id="bottomArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  </defs>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#a63241" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      সরকারি ব্রজমোহন কলেজ, বরিশাল
    </textPath>
  </text>
</svg>
